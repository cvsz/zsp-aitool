name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required files
        run: |
          test -f README.md
          test -f .faf
          test -f AGENTS.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/architecture.md
          test -f docs/roadmap.md
          test -f docs/prompts/README.md

      - name: List prompt pack
        run: |
          find docs/prompts -maxdepth 1 -type f -name '*.md' -print

