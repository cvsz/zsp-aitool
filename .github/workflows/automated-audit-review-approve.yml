name: Automated Audit + Review + Approve (policedbc)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

concurrency:
  group: auto-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # policedbc PAT must be stored as repository secret: POLIEDBC_PAT
  # Required scopes: repo, write:discussion, pull_request
  POLIEDBC_PAT: ${{ secrets.POLIEDBC_PAT }}
  GH_TOKEN: ${{ secrets.POLIEDBC_PAT }}

jobs:
  validate-secrets:
    name: Validate required secrets
    runs-on: ubuntu-latest
    outputs:
      all-present: ${{ steps.check.outputs.all-present }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          [ -z "${{ secrets.POLIEDBC_PAT }}" ] && { echo "::error::POLIEDBC_PAT secret is not set."; echo "all-present=false" >> $GITHUB_OUTPUT; exit 1; }
          echo "all-present=true" >> $GITHUB_OUTPUT

  audit-and-review:
    name: Audit, Review & Approve (policedbc)
    needs: validate-secrets
    if: needs.validate-secrets.outputs.all-present == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run repository validation audit
        id: audit
        run: |
          echo "=== Running validate_repo.py ==="
          if ! python3 scripts/validate_repo.py; then
            echo "AUDIT_RESULT=FAILED" >> $GITHUB_ENV
            echo "::error::Repository validation failed."
            exit 1
          fi

          echo "=== Checking for tracked secret-bearing files ==="
          if git ls-files | grep -E '(^|/)(\.env$|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo "AUDIT_RESULT=FAILED" >> $GITHUB_ENV
            echo "::error::Potential secret-bearing file is tracked."
            exit 1
          fi

          echo "=== Validating GitHub workflow YAML ==="
          if ! ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'; then
            echo "AUDIT_RESULT=FAILED" >> $GITHUB_ENV
            echo "::error::Invalid GitHub Actions YAML detected."
            exit 1
          fi

          echo "AUDIT_RESULT=PASSED" >> $GITHUB_ENV
          echo "=== Audit complete: PASSED ==="

      - name: Determine if auto-approve is safe
        id: safety
        run: |
          # Security-sensitive paths require human review (per CODEOWNERS).
          # Auto-approve ONLY if audit passed AND no security-sensitive paths changed.
          SECURE_PATHS='^(\.github/|SECURITY\.md|AGENTS\.md|installer\.nsi|install\.ps1|install-full-auto\.ps1|build\.ps1|config\.toml|config\.example\.toml)'
          
          # Use GitHub API to get changed files (fail-safe: default to SECURITY_CHANGED=1 on error)
          CHANGED_FILES="$(gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename' 2>/dev/null || true)"
          
          SECURITY_CHANGED=1  # Default to safe (require human review) if we can't determine
          if [ -n "$CHANGED_FILES" ]; then
            if echo "$CHANGED_FILES" | grep -Eq "$SECURE_PATHS"; then
              SECURITY_CHANGED=1
              echo "Security-sensitive files changed — human review required."
            else
              SECURITY_CHANGED=0
              echo "No security-sensitive files changed."
            fi
          else
            echo "WARNING: Could not retrieve changed files via API — defaulting to human review."
          fi

          if [ "${AUDIT_RESULT}" = "PASSED" ] && [ "$SECURITY_CHANGED" = "0" ]; then
            echo "AUTO_APPROVE_SAFE=1" >> $GITHUB_ENV
            echo "Auto-approve is safe (audit passed, no security-sensitive changes)."
          else
            echo "AUTO_APPROVE_SAFE=0" >> $GITHUB_ENV
            echo "Auto-approve NOT safe — leaving review comment only."
          fi

      - name: Post audit review comment (policedbc)
        run: |
          chmod +x .github/scripts/post-review-comment.sh
          .github/scripts/post-review-comment.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ env.AUDIT_RESULT }}" \
            "${{ env.AUTO_APPROVE_SAFE }}" \
            "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.POLIEDBC_PAT }}

      - name: Request human review (security paths or audit failed)
        if: env.AUTO_APPROVE_SAFE == '0'
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --request-changes \
            --body "Security-sensitive paths changed or audit failed. Human review by @policedbc required per CODEOWNERS before merge." \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.POLIEDBC_PAT }}