name: Automated Audit + Review + Approve (policedbc)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to audit'
        required: true
        type: string
      sha:
        description: 'Immutable SHA to audit (overrides PR head)'
        required: false
        type: string

concurrency:
  group: auto-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-secrets:
    name: Validate required secrets
    runs-on: ubuntu-latest
    outputs:
      all-present: ${{ steps.check.outputs.all-present }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          [ -z "${{ secrets.POLIEDBC_PAT }}" ] && { echo "::error::POLIEDBC_PAT secret is not set."; echo "all-present=false" >> $GITHUB_OUTPUT; exit 1; }
          echo "all-present=true" >> $GITHUB_OUTPUT

  audit-and-review:
    name: Audit, Review & Report (policedbc)
    needs: validate-secrets
    if: needs.validate-secrets.outputs.all-present == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch (read-only, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.sha || format('refs/pull/{0}/merge', github.event.inputs.pr_number) }}

      - name: Configure git identity (local only, no signing)
        run: |
          git config user.name "cvsz"
          git config user.email "cvsz@seaza.com"
          git config commit.gpgsign false

      - name: Run repository validation audit (read-only, no secrets)
        id: audit
        run: |
          echo "=== Running validate_repo.py ==="
          if ! python3 scripts/validate_repo.py; then
            echo "AUDIT_RESULT=FAILED" >> $GITHUB_ENV
            echo "::error::Repository validation failed."
            exit 1
          fi

          echo "=== Checking for tracked secret-bearing files ==="
          if git ls-files | grep -E '(^|/)(\\.env$|id_rsa|id_ed25519|.*\\.pem|.*\\.key)$' | grep -v '^\\.env\\.example$'; then
            echo "AUDIT_RESULT=FAILED" >> $GITHUB_ENV
            echo "::error::Potential secret-bearing file is tracked."
            exit 1
          fi

          echo "=== Validating GitHub workflow YAML ==="
          if ! ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'; then
            echo "AUDIT_RESULT=FAILED" >> $GITHUB_ENV
            echo "::error::Invalid GitHub Actions YAML detected."
            exit 1
          fi

          echo "AUDIT_RESULT=PASSED" >> $GITHUB_ENV
          echo "=== Audit complete: PASSED ==="

      - name: Post audit review comment (policedbc)
        run: |
          chmod +x .github/scripts/post-review-comment.sh
          .github/scripts/post-review-comment.sh \
            "${{ github.event.inputs.pr_number }}" \
            "${{ env.AUDIT_RESULT }}" \
            "0" \
            "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.POLIEDBC_PAT }}

      - name: Request changes if audit failed or security issues found
        if: env.AUDIT_RESULT != 'PASSED'
        run: |
          gh pr review ${{ github.event.inputs.pr_number }} \
            --request-changes \
            --body "Audit failed. Fix the errors above before review." \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.POLIEDBC_PAT }}
